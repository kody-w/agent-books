name: Books and citation drift
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 8 * * 1"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: claude/examples/requirements.txt
      - run: python -m pip install -r claude/examples/requirements.txt
      - run: python build.py
      - run: python -m unittest discover -s tests -v
      - name: Require committed generated output
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Check official citations (weekly and manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_links.py --report "${{ runner.temp }}/doc-links.json"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: official-doc-link-evidence
          path: ${{ runner.temp }}/doc-links.json
          if-no-files-found: warn
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.BOOKS_PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deploy
